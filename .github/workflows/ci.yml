name: TriBinary CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Check preregistration hash integrity
        run: |
          python tools/prereg_hash.py
          python -c "from tools.prereg_hash import hypotheses_hash, LOCK; assert hypotheses_hash() == LOCK.read_text().strip(), 'prereg-v1 hash mismatch!'"

      - name: Rust Core Tests
        run: |
          cd core
          cargo test --verbose

      - name: Build and install Python package
        run: |
          pip install --upgrade pip maturin pytest numpy scipy pyyaml httpx
          maturin develop --release

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Run Verification Gate & Experiments
        run: |
          tribinary verify --suite m1
          tribinary run experiments/m1_comparator.yaml
          tribinary run experiments/m2_mini_gpu.yaml
          tribinary run experiments/m3_full_gpu.yaml
          tribinary run experiments/h4_noise.yaml
          tribinary report
