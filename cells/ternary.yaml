# ternary cell library
#
# GENERATED by tools/gen_cell_libs.py. Edit the generator, then regenerate.
# Truth tables are verified against the golden models by tests/test_cells.py (L0).
#
# Every numeric hardware value is an ASSUMPTION (see docs/assumptions.md). Values marked
# confidence: low are PLACEHOLDERS with no verified source (open question Q21).
#
# Short form: `transistors: 28` expands to the record in `defaults.transistors` with value 28.
# Parameters derived at load time: area, switch_energy, leakage, delay, noise_margin_fraction.

library: ternary
version: 0.1.0
status: reviewed   # truth tables verified (L0); numeric parameters remain flagged assumptions
system: t
radix: 3
levels: [-1, 0, 1]
voltage_swing:
  {value: 1.0, unit: V, source_type: guess, source: "normalised swing; absolute value cancels in ratios", confidence: medium}
technology:
  tau: {value: 10.0, unit: ps, source_type: guess, confidence: low, group: ternary_delay_unit,
    source: "same numeric value as the binary library so that differences come from cell structure; no process source"}
  area_per_transistor: {value: 0.1, unit: um2, source_type: guess, confidence: low, group: ternary_area_unit,
    source: "placeholder layout density; no process source"}
  energy_per_transistor: {value: 0.2, unit: fJ, source_type: guess, confidence: low, group: ternary_energy_unit,
    source: "placeholder switching energy per transistor per output toggle; no process source"}
  leakage_per_transistor: {value: 0.5, unit: nW, source_type: guess, confidence: low, group: ternary_leakage_unit,
    source: "placeholder leakage per transistor; no process source"}
  maturity_factor: {value: 1.0, unit: ratio, source_type: guess, confidence: low, group: ternary_maturity,
    source: "neutral nominal 1.0 (no maturity penalty or bonus); scaled in sensitivity analysis (open question Q7)"}
defaults:
  transistors:
    {unit: transistors, source_type: guess, confidence: low, group: ternary_cell_cost,
     source: "PLACEHOLDER rule: 2.0 x transistors of the nearest binary analog cell; no verified source (open question Q21)"}
  delay_stages:
    {unit: tau, source_type: guess, confidence: low, group: ternary_cell_delay,
     source: "PLACEHOLDER rule: 1.5 x delay stages of the nearest binary analog cell; no verified source (open question Q21)"}
